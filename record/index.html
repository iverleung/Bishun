<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f1">
  <title>拼音录音</title>
  <link rel="icon" href="%BASE_URL%icon.png" type="image/png">
  <link rel="stylesheet" href="/src/recorder/style.css">
</head>
<body>
  <main class="recorder-app">
    <header class="recorder-header">
      <h1 id="recordingTitle">拼音录音</h1>
      <span id="progressText">0 / 0</span>
    </header>
    <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
    <div class="recording-modes" role="group" aria-label="录音类型">
      <button class="mode-option is-active" type="button" data-recording-mode="pinyin" aria-pressed="true" disabled>拼音</button>
      <button class="mode-option" type="button" data-recording-mode="strokes" aria-pressed="false" disabled>笔画</button>
    </div>

    <section class="recording-card" aria-labelledby="reading">
      <p id="position" class="recording-position"></p>
      <h2 id="reading">…</h2>
      <p id="readingExamples" class="reading-examples" aria-label="示例汉字"></p>
      <p id="recordHint" class="recording-hint">按住下方按钮，读完后松开</p>
      <p id="recordState" class="record-state" role="status" aria-live="polite">正在准备…</p>
      <p id="qualityText" class="quality-text" role="status"></p>
      <p id="timer" class="recording-timer" aria-hidden="true"></p>
    </section>

    <div class="recording-actions">
      <button id="recordBtn" class="record-action" type="button" disabled><span class="record-dot" aria-hidden="true"></span><span id="recordLabel">按住录音</span></button>
      <div class="playback-slot">
        <audio id="playback" controls playsinline preload="auto" hidden></audio>
        <div class="auto-playback-controls">
          <select id="autoScope" aria-label="自动试听范围">
            <option value="recorded">全部已录</option>
            <option value="review">仅待复查</option>
          </select>
          <button id="autoPlaybackBtn" class="text-action" type="button" disabled>自动试听</button>
        </div>
      </div>
      <p id="message" class="recorder-message" role="alert" hidden></p>
    </div>

    <nav id="recordingNavigation" class="recording-navigation" aria-label="切换拼音">
      <button id="previousBtn" class="navigation-action" type="button">上一项</button>
      <button id="nextBtn" class="navigation-action" type="button">下一项</button>
      <button id="nextUnrecordedBtn" class="text-action" type="button">下个未录</button>
      <button id="nextReviewBtn" class="text-action" type="button">下个待复查</button>
    </nav>

    <details class="recording-tools">
      <summary>管理与导出</summary>
      <div class="recording-tools-content">
        <label id="recordingFilterLabel" for="recordingFilter">筛选拼音</label>
        <select id="recordingFilter">
          <option value="all">全部</option>
          <option value="recorded">已录</option>
          <option value="unrecorded">未录</option>
          <option value="review">待复查</option>
        </select>
        <label id="readingSelectLabel" for="readingSelect">跳转到拼音</label>
        <select id="readingSelect"></select>
        <p id="qualityProgress">打开后逐项检查已录音频；技术结果仅供复查。</p>
        <button id="reviewToggleBtn" class="secondary-action" type="button" disabled>标记重录</button>
        <button id="exportBtn" class="secondary-action" type="button" disabled>导出全部录音</button>
        <p>录音仅保存在当前浏览器，清除网站数据会删除录音。请定期导出备份。</p>
      </div>
    </details>
  </main>
  <script type="module" src="/src/recorder/main.js"></script>
</body>
</html>
